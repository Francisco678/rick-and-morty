<div [routerLink]="['/rickandmorty/characters', this.inputCharacter().id]" class="card-body">
    <img class="characterImage" [src]="this.inputCharacter().image"/>
    <p>Id: {{this.inputCharacter().id}}</p>
    <p>Name: {{this.inputCharacter().name}}</p>
    <p>Status: {{this.inputCharacter().status}}</p>
    <p>Species: {{this.inputCharacter().species}} </p>
</div>
